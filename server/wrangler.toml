# Remembered team server: the app (../docs) plus team AI, behind Cloudflare Access.
# Secrets are set with `wrangler secret put`, never stored here:
#   OPENAI_API_KEY, ACCESS_TEAM_DOMAIN, ACCESS_AUD, OWNER_EMAIL
name = "remembered"
main = "src/worker.js"
compatibility_date = "2026-08-01"

[assets]
directory = "../docs"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Daily limits (reset at midnight Malaysia time). Change a number and redeploy.
[vars]
IMAGE_MODEL = "gpt-image-2"
TEXT_MODEL = "gpt-5-mini"
IMAGE_QUALITY = "medium"
DAILY_POSTERS = "5"
OWNER_DAILY_POSTERS = "20"
DAILY_WORDS = "30"
TEAM_DAILY_POSTERS = "60"
DAILY_SCANS = "20"

[[kv_namespaces]]
binding = "USAGE"
id = "daaa700913d9463e8e447c1c40351177"

# Hourly: sends each agent's daily 定联 reminder at the hour they picked, and the 9pm nudge
[triggers]
crons = ["0 * * * *"]
